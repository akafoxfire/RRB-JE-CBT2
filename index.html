const S=[{"id": 1, "name": "Electronic Components and Materials", "short": "Components", "time": 10, "deep": "Energy band derivation of semiconductors, crystal structure, calculating protective relay settings.", "subs": [["1.1", "Conductors, Semiconductors, Insulators", "Conductor: order of conductivity (silver, copper, aluminium), ACSR/AAC/AAAC, resistive alloys (manganin, constantan, nichrome), carbon brush, effect of annealing/hardening, resistance rising with temperature. Semiconductor: intrinsic/extrinsic, majority carriers in n and p type, forbidden gap, hole drift, valence electrons. Insulator: dielectric strength, insulation classes (max temperature of Y, A, E, B, F, H, C), glass, mica, SF6, transformer oil, power rating of a resistor.", ""], ["1.2", "Magnetic Materials", "Soft vs hard magnetic materials, Alnico, ferrite, dia/para/ferromagnetic, B-H loop, retentivity, coercivity, hysteresis loss (from loop area), eddy current loss, thickness of laminations.", "Hysteresis loss = loop area x frequency"], ["1.3", "Jointing and Cleaning Materials (U/G cable, OFC)", "Joints in underground cable (straight, tee), jointing compound, solder, cleaning solvent. OFC: fusion and mechanical splicing, cleaver, isopropyl alcohol for cleaning. One page only.", ""], ["1.4", "Cells and Batteries", "Primary vs secondary cells, Leclanche, alkaline, lead-acid (specific gravity, charging), Ni-Cd, Ni-Fe, Li-ion. Ah to coulomb, voltage of cells in series, charging current from Ah.", "Ah x 3600 = coulomb; charging current = Ah/10"], ["1.5", "Relays", "Types of relay: electromagnetic, solid state, thermal, reed, shading coil of an AC relay. Protective relays: overcurrent, differential, distance, microprocessor-based. PSM, TSM, sensitivity, selectivity. Only the name, purpose and a one-line definition.", ""], ["1.6", "Switches", "Not asked in the last 5 papers. Types: SPST, SPDT, DPDT, push button, toggle, rotary, limit switch.", ""], ["1.7", "MCB", "Thermal and magnetic trip, B/C/D curves, fuse vs MCB vs circuit breaker, causes of a fuse not blowing.", ""], ["1.8", "Connectors", "PCB (component side, pads), breadboard, BNC, HDMI, USB, DB9, RJ45, coaxial connector, heating from a loose connection.", ""]]}, {"id": 2, "name": "Electronic Devices and Circuits", "short": "Devices", "time": 14, "deep": "h-parameter model, small-signal analysis, Miller effect, frequency response derivation, class D/E amplifiers, loop-gain math of feedback.", "subs": [["2.1", "PN Junction Diodes", "Depletion region (what changes in forward and reverse bias), DC resistance of a diode, average output of an ideal diode. Special diodes: Zener (breakdown, temperature coefficient), varactor, Gunn, LED, photodiode, tunnel, Schottky (one line each).", "Zener Vz with temp coefficient; reverse DC resistance = V/I; ideal diode average"], ["2.2", "Thyristors", "SCR: two-transistor model, 3 junctions, triggering, latching and holding current, turn on/off. TRIAC, DIAC, UJT: symbol and working. Power devices: Power MOSFET and IGBT (name and use only).", ""], ["2.3", "Diode and Triode Circuits", "Output waveforms of clippers and clampers (positive, negative, biased). Operating region of a vacuum diode. Triode: mu, rp, gm and their relation.", "Series diode + load: voltage divider"], ["2.4", "Junction Transistors", "Configurations: CE, CB, CC (input/output impedance, current gain, phase shift). Relations: alpha, beta, gamma, IC/IB/IE. Biasing: fixed, voltage divider, collector-to-base. Also: Q-point, thermal runaway, transistor as a switch. FET and MOSFET: voltage controlled, high input impedance.", ""], ["2.5", "Amplifiers", "Coupling: RC, transformer, direct (and which gives the highest gain). Feedback: 4 types and the effect on input/output impedance. Power amplifiers: class A, B, AB, C efficiency. Also: heat sink, emitter follower.", "Feedback: Zin = Ri(1+A*beta), Zout = Ro/(1+A*beta)"], ["2.6", "Oscillators", "Barkhausen condition, RC phase shift, Wien bridge, Hartley and Colpitts frequency formulas, quartz crystal (series and parallel resonance).", ""], ["2.7", "Multivibrators", "Astable, monostable, bistable, Schmitt trigger. Frequency of an astable circuit, generating a ramp from a monostable.", "Astable frequency proportional to 1/C"], ["2.8", "Counters (analog context)", "Same as 3.6 in Digital Electronics, so study that topic.", ""], ["2.9", "Rectifiers", "Vdc, Vrms, ripple factor, PIV, efficiency and TUF table for half wave, full wave (centre-tap) and bridge. Number of diodes, filters (C, L, LC, pi), voltage doubler and multiplier.", "Bridge PIV = Vm; HW Vdc = Vm/pi; minimum frequency from diode on-time"], ["2.10", "Inverters and UPS", "Block diagram of an inverter, online vs offline UPS, chopper (DC to variable DC).", ""]]}, {"id": 3, "name": "Digital Electronics", "short": "Digital", "time": 14, "deep": "Quine-McCluskey, details of hazards and race conditions, state machine design, FPGA/PLD architecture.", "subs": [["3.1", "Number Systems and Binary Codes", "Conversion between binary, octal and hex, decimal to binary, 1's and 2's complement, subtraction using 2's complement (meaning of the carry), BCD, excess-3, gray code, ASCII, spotting valid digits.", "Conversions, bits needed for a decimal, 2's complement, excess-3, BCD, count of 1s"], ["3.2", "Boolean Algebra and Logic Gates", "Truth table and symbol of all gates, NAND/NOR as universal gates, XOR/XNOR, De Morgan, Boolean laws (A + A' = 1), K-map, IC numbers (7400, 7408, 7432, 7486), SSI/MSI/LSI/VLSI.", "Boolean functions of n variables = 2^(2^n)"], ["3.3", "Combinational Logic", "Expressions for half/full adder and half/full subtractor, multiplexer, demultiplexer, encoder (priority), decoder (3-to-8, BCD-to-decimal), comparator. Counting select lines and outputs.", "Demux output chosen by select lines"], ["3.4", "Sequential Logic", "SR, JK, D, T flip-flop truth tables, race-around, master-slave, edge vs level triggering, NOR/NAND latch, shift registers (SISO, SIPO, PISO, PIPO, IC 74194).", "T flip-flop state after n pulses"], ["3.5", "A/D and D/A Converters", "Difference and conversion time of flash, counter type, successive approximation and dual slope ADC. R-2R ladder, weighted resistor DAC, resolution.", "Flash ADC comparators = 2^n - 1"], ["3.6", "Counters", "Ripple vs synchronous, modulo-N, decade counter, ring counter, Johnson counter (counting states), propagation delay.", "Johnson unused states = 2^n - 2n; ripple delay = n x tpd"], ["3.7", "Memories", "RAM, ROM, PROM, EPROM, EEPROM, flash, SRAM, DRAM, full form of DDR. Relation between address lines and memory size.", "Address lines = log2(size); 4 kB = 12 lines"]]}, {"id": 4, "name": "Linear Integrated Circuits", "short": "Linear ICs", "time": 6, "deep": "Active filter design (Butterworth, Chebyshev), oscillator and waveform generator design, internal circuits of ADC/DAC ICs.", "subs": [["4.1", "Introduction to Op-Amp", "Properties of an ideal op-amp (infinite gain and input resistance, zero output resistance), differential amplifier, stages of IC 741, dual supply, open-loop saturation, CMRR, slew rate.", "Output clips at supply (+/- Vsat)"], ["4.2", "Linear Applications", "Gain formulas of inverting and non-inverting amplifiers, summing amplifier, subtractor, integrator, differentiator, voltage follower, instrumentation amplifier.", "Gain = 1 + Rf/R1; -Rf/R1"], ["4.3", "Non-linear Applications", "Comparator, Schmitt trigger, precision rectifier, log/antilog amplifier, peak detector.", ""], ["4.4", "Voltage Regulators", "78xx and 79xx (7905 = -5 V), IC 723, linear vs switching regulator, line and load regulation.", ""], ["4.5", "Timers", "Internal blocks of the 555 (two comparators, flip-flop, discharge transistor), astable and monostable frequency or pulse width, pin functions.", ""], ["4.6", "Phase-Locked Loop", "Blocks (phase detector, low pass filter, VCO), lock range vs capture range, FM/AM/FSK demodulation, frequency synthesizer, IC 565.", "Frequency after divider into PLL"]
