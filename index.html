let PQ=null,pf={s:0,p:"",c:""};const PAP=["2019 S1","2019 S2","2024 S1","2024 S2","2025"];

function qcard(x){const ch=state.pq[x.i],done=ch!==undefined;return`<div class="card qc" data-qid="${x.i}"><div class="qh"><span class="pill n">${x.p} · Q${x.n}</span></div><p class="qt">${esc(x.q)}</p><div class="qo">${x.o.map((o,k)=>`<button class="qb ${!done?"":k==x.a?"ok":k==ch?"bad":""}" data-qo="${x.i}|${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>${done?`<div class="qa">${ch<0?"👁":ch==x.a?"✅ Sahi!":"❌ Galat"} Answer: <b>${"ABCD"[x.a]}</b>${x.e?`<p class="tip">💡 ${esc(x.e)}</p>`:""}</div>`:`<button class="chip" data-qs="${x.i}">👁 Answer dekho</button>`}</div>`}
function qref(i){const e=$('[data-qid="'+i+'"]'),x=PQ.find(y=>y.i==i);if(e&&x)e.outerHTML=qcard(x)}
function pyq(){loadPQ();const all=PQ||[],L=all.filter(x=>(!pf.c||x.c===pf.c)&&(!pf.s||+x.c.split(".")[0]===pf.s)&&(!pf.p||x.p===pf.p)),att=L.filter(x=>state.pq[x.i]>=0),ok=att.filter(x=>state.pq[x.i]==x.a).length,g={};L.forEach(x=>(g[x.c]=g[x.c]||[]).push(x));

<div class="filters"><button class="chip" data-pfs="0" aria-pressed="${!pf.s}">Sab subject</button>${S.map(s=>`<button class="chip" data-pfs="${s.id}" aria-pressed="${pf.s===s.id}">${EMO[s.id]} ${s.short}</button>`).join("")}</div>
<div class="filters"><button class="chip" data-pfp="" aria-pressed="${!pf.p}">Sab paper</button>${PAP.map(p=>`<button class="chip" data-pfp="${p}" aria-pressed="${pf.p===p}">${p}</button>`).join("")}</div>
${pf.c?`<div class="tip">Topic filter: <b>${pf.c} ${nameOf[pf.c]||""}</b> <button class="chip" data-pfc="1">✕ hatao</button></div>`:""}
<p class="sub">${PQ&&PQ.err?"pyq.json load nahi hui. Site GitHub Pages pe kholo.":!all.length?"Load ho raha hai...":`${L.length} sawal · attempt ${att.length} · sahi ${ok}${att.length?" ("+Math.round(100*ok/att.length)+"%)":""}`}</p>
${order.map(x=>`<h3 class="qg">${x[0]} ${x[1]} <span class="pill">${g[x[0]].length}</span></h3>${g[x[0]].sort((a,b)=>PAP.indexOf(a.p)-PAP.indexOf(b.p)||a.n-b.n).map(qcard).join("")}`).join("")}`}

/* MOCK */
function mock(){$("#v-mock").innerHTML=`<h2>📈 Mock Test Tracker</h2><p class="sub">Har mock ke baad technical (100 me se) attempt aur sahi sawal likho. Net = sahi − galat/3.</p><div class="card"><div class="form"><div><label>Attempt</label><input type="number" id="ma" min="0" max="100" placeholder="85" style="width:90px"></div><div><label>Sahi</label><input type="number" id="mc" min="0" max="100" placeholder="62" style="width:90px"></div><button class="btn p" id="madd">Add mock</button></div><div id="mlist" style="margin-top:14px"></div></div>`;drawMocks()}
function drawMocks(){const m=state.mocks,b=$("#mlist");if(!m.length){b.innerHTML='<div class="empty">Abhi koi mock nahi.</div>';return}const nets=m.map(x=>x.c-(x.a-x.c)/3),W=300,H=90,mn=Math.min(0,...nets),mx=Math.max(100,...nets),pts=nets.map((v,i)=>[m.length>1?10+i*(W-20)/(m.length-1):W/2,H-8-(v-mn)/(mx-mn)*(H-16)]);
b.innerHTML=`<p class="sub">${m.length} mock · Best <b>${Math.max(...nets).toFixed(1)}</b> · Average <b>${(nets.reduce((a,v)=>a+v,0)/nets.length).toFixed(1)}</b></p><svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#22d3ee" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff5ca8"/>`).join("")}</svg><table><tr><th>#</th><th>Att</th><th>Sahi</th><th>Net</th><th></th></tr>${m.map((x,i)=>`<tr><td>${i+1}</td><td>${x.a}</td><td>${x.c}</td><td><b>${nets[i].toFixed(1)}</b></td><td><button class="chip" data-del="${i}">hata</button></td></tr>`).join("")}</table>`}

/* events */

function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<8;i++){const e=document.createElement("span");e.className="burst";e.textContent=["🎉","✨","⚡","🔥"][i%4];e.style.cssText=`left:${r.left+10}px;top:${r.top}px;--x:${(i-4)*18}px`;document.body.append(e);setTimeout(()=>e.remove(),1000)}}
function upd(){const p=progress();$("#mt").textContent=p+"%";$("#mb").style.width=p+"%"}
function route(){const sp=location.hash.slice(1).split("/");let h=sp[0];if(h=="pyq")pf.c=sp[1]||"";if(!R[h])h="home";Object.keys(R).forEach(v=>$("#v-"+v).classList.toggle("on",v==h));document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")=="#"+h?"page":"false"));R[h]();upd();scrollTo(0,0)}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-tick],[data-mark],[data-t],[data-num],[data-del],[data-ns],[data-pdf],[data-qo],[data-qs],[data-pfs],[data-pfp],[data-pfc],[data-done],[data-up],[data-nd],[data-ne],#madd,#theme,#pdfb,#login");if(!t)return;const d=t.dataset;

else if(d.pdf||t.id=="pdfb")printDoc(d.pdf||"all");else if(t.id=="login"){if(user){await sb.auth.signOut();user=null;state={pq:{},st:{},mocks:[],exam:"",hrs:6,jd:{},th:state.th};save();route()}else sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}
